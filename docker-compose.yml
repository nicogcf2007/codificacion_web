services:
  backend:
    image: codificacion-backend:v2.0.1
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/modern.sqlite3}
      CODING_PROVIDER: ${CODING_PROVIDER:-openai}
      CNC_ADMIN_EMAIL: ${CNC_ADMIN_EMAIL:-admin@cnc.com.co}
      CNC_ADMIN_PASSWORD: ${CNC_ADMIN_PASSWORD:-Admin12345678!}
      CNC_ADMIN_NAME: ${CNC_ADMIN_NAME:-Administrador CNC}
      CNC_COOKIE_SECURE: ${CNC_COOKIE_SECURE:-true}
      CNC_ENV: ${CNC_ENV:-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://codificacion.cnccol.com}
      INPUT_USD_PER_MILLION: ${INPUT_USD_PER_MILLION:-}
      OUTPUT_USD_PER_MILLION: ${OUTPUT_USD_PER_MILLION:-}
      BASELINE_RECORD_USD: ${BASELINE_RECORD_USD:-}
    expose:
      - "8020"
    volumes:
      - codificacion_data:/app/data
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    image: codificacion-frontend:v2.0.1
    build:
      context: ./frontend
    expose:
      - "80"
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  codificacion_data:
